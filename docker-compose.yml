services:
  # MySQL 数据库服务
  mysql:
    image: mysql:5.7
    container_name: vblog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-vblog_root_123}
      MYSQL_DATABASE: vueblog2
      MYSQL_USER: ${DB_USERNAME:-vblog_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-vblog_pass_123}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./blogserver/src/main/resources/vueblog.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - vblog-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 后端 Spring Boot 服务
  blogserver:
    build:
      context: ./blogserver
      dockerfile: Dockerfile
    container_name: vblog-server
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: mysql:3306
      DB_USERNAME: ${DB_USERNAME:-vblog_user}
      DB_PASSWORD: ${DB_PASSWORD:-vblog_pass_123}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - vblog-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 前端 Nginx 服务
  vueblog:
    build:
      context: ./vueblog
      dockerfile: Dockerfile
    container_name: vblog-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - blogserver
    networks:
      - vblog-network

volumes:
  mysql_data:
    driver: local

networks:
  vblog-network:
    driver: bridge
