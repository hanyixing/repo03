name: VBlog CI/CD Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

jobs:
  # ==================== 后端构建与测试 ====================
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./blogserver

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vueblog2_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission to mvnw
        run: chmod +x mvnw

      - name: Run tests with JaCoCo coverage
        run: ./mvnw clean test -Ptest -B
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Build application (prod profile)
        run: ./mvnw clean package -Pprod -DskipTests -B

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: jacoco-report
          path: blogserver/target/jacoco/

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: blogserver-jar
          path: blogserver/target/blogserver-*.jar

  # ==================== 前端构建 ====================
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./vueblog

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '10'
          cache: 'npm'
          cache-dependency-path: vueblog/package-lock.json

      - name: Install dependencies
        run: npm install --registry=https://registry.npm.taobao.org

      - name: Build for production
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: vueblog-dist
          path: vueblog/dist/

  # ==================== Docker 镜像构建 ====================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./blogserver
          push: false
          tags: vblog/blogserver:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./vueblog
          push: false
          tags: vblog/vueblog:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test docker-compose
        run: |
          docker-compose config
          echo "docker-compose configuration is valid"
