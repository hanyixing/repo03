name: CI

on:
  push:
    branches: [ master, "claude*" ]
  pull_request:
    branches: [ master ]

jobs:
  backend:
    name: Backend (build, test, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blogserver
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build, test and generate JaCoCo report
        run: mvn -B -Pprod clean verify

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: blogserver/target/site/jacoco/
          if-no-files-found: warn

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vueblog
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build production bundle
        run: npm run build

  docker-build:
    name: Docker image (backend)
    runs-on: ubuntu-latest
    needs: [ backend ]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t blogserver:ci ./blogserver
